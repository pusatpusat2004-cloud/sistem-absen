name: Absensi Otomatis Daily

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  absen:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Langkah ini wajib agar Python di server tidak error saat membaca zona waktu Jakarta
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytz

    - name: Run Attendance Script
      run: python absensi.py

    # Langkah ini wajib agar file database_absensi.csv yang baru dibuat bisa disimpan di GitHub
    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add database_absensi.csv || exit 0
        git commit -m "Sistem: Absensi otomatis berhasil dicatat" || exit 0
        git push
